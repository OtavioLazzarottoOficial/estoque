version: '3.8'

services:
  postgres:
    image: bitnami/postgresql:latest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=estoque
    volumes:
      - estoque_pg_data:/bitnami/postgresql

volumes:
  estoque_pg_data:
